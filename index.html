<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Campeonato Mundial Pro</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: #121212;
            color: #fff;
            text-align: center;
            padding: 15px;
            min-height: 100vh;
        }

        h1 {
            margin-bottom: 15px;
            font-size: clamp(1.5em, 5vw, 2.5em);
            color: #ffd700;
        }

        #phase-title {
            margin-bottom: 15px;
            font-size: clamp(1.2em, 4vw, 1.8em);
            color: #ffd700;
        }

        .group-container {
            display: flex;
            justify-content: space-between;
            max-width: 1200px;
            margin: 0 auto 20px;
            gap: 15px;
        }

        #left-groups, #right-groups {
            display: flex;
            flex-direction: column;
            width: 49%;
            gap: 15px;
        }

        .group, .match {
            background: rgba(255, 255, 255, 0.05);
            padding: 12px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .group h2, .match h2 {
            color: #ffd700;
            margin-bottom: 10px;
            font-size: clamp(1em, 3vw, 1.2em);
        }

        .group-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 8px;
            font-size: clamp(11px, 2.2vw, 13px);
        }

        .group-table th, .group-table td {
            padding: 6px 4px;
            text-align: center;
        }

        .group-table th {
            color: #f4a261;
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
        }

        .group-table td.team-name {
            text-align: left;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .group-table img, .match-gallery img {
            cursor: pointer;
        }

        .group-table img {
            width: 20px;
            height: 20px;
            object-fit: cover;
            border-radius: 3px;
        }

        .classified {
            color: #4ad66d;
            font-weight: bold;
        }

        .match-gallery {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            margin-top: 5px;
        }

        .match-team {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 45%;
            cursor: pointer;
            padding: 5px;
            border-radius: 6px;
            transition: background 0.2s;
        }

        .match-team:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .match-gallery img {
            width: 50px;
            height: 50px;
            object-fit: cover;
            border-radius: 6px;
            transition: opacity 0.5s, width 0.5s;
        }
        
        .match-team.eliminated img {
            opacity: 0.2;
        }

        .match-team span {
            font-size: 12px;
            margin-top: 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 100%;
        }

        #delete-btn {
            position: fixed;
            bottom: 15px;
            right: 15px;
            background-color: #e63946;
            color: white;
            border: none;
            padding: clamp(10px, 2vw, 15px);
            font-size: clamp(14px, 3vw, 18px);
            border-radius: 50%;
            cursor: pointer;
            z-index: 1000;
        }

        #fullscreen-container {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            align-items: center;
            justify-content: center;
            flex-direction: column;
            z-index: 2000;
            padding: 20px;
        }

        #fullscreen-container img {
            max-width: 80%;
            max-height: 40%;
            border-radius: 8px;
        }

        .profile-card {
            background: #1e1e1e;
            padding: 15px;
            border-radius: 8px;
            width: 100%;
            max-width: 450px;
            margin-top: 15px;
            border: 1px solid #ffd700;
            text-align: left;
        }

        .profile-card h3 {
            color: #ffd700;
            margin-bottom: 10px;
            text-align: center;
            font-size: 16px;
        }

        .stats-scroll {
            max-height: 180px;
            overflow-y: auto;
            font-size: 12px;
            padding-right: 5px;
        }

        .stats-row {
            display: flex;
            justify-content: space-between;
            padding: 5px 0;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        .ticker-container {
            background: rgba(0, 0, 0, 0.4);
            padding: 8px;
            border-radius: 6px;
            margin-top: 10px;
            font-size: 11px;
            color: #ccc;
            text-align: left;
            max-height: 80px;
            overflow-y: auto;
        }

        #restart-btn {
            margin-top: 15px;
            padding: 8px 15px;
            background: #f4a261;
            border: none;
            color: white;
            border-radius: 4px;
            cursor: pointer;
        }

        #champion-history { margin-top: 30px; }
        #champion-list {
            list-style: none;
            padding: 0;
            max-width: 600px;
            margin: 0 auto;
            max-height: 300px;
            overflow-y: auto;
        }

        #champion-list li {
            background: rgba(255, 255, 255, 0.1);
            margin: 8px 0;
            padding: 10px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            font-size: clamp(12px, 2.5vw, 14px);
        }

        #champion-list li.gold { background: rgba(255, 215, 0, 0.2); border: 2px solid #ffd700; }
        #champion-list li.silver { background: rgba(192, 192, 192, 0.2); border: 2px solid #c0c0c0; }
        #champion-list li.bronze { background: rgba(205, 127, 50, 0.2); border: 2px solid #cd7f32; }

        #champion-list img.trophy { width: 35px; height: 35px; border-radius: 50%; object-fit: cover; cursor: pointer;}
        #champion-list .trophy-history { font-weight: bold; color: #f4a261; font-size: 11px; max-width: 55%; text-align: right; word-break: break-word; }

        @media (max-width: 768px) {
            .group-container { flex-direction: column; gap: 15px; }
            #left-groups, #right-groups { width: 100%; display: flex; flex-direction: column; gap: 15px; }
        }
    </style>
</head>
<body>
    <h1>Campeonato Mundial <span id="tournament-number">001</span></h1>
    <h2 id="phase-title">Fase de Grupos</h2>
    
    <div class="group-container">
        <div id="left-groups"></div>
        <div id="right-groups"></div>
    </div>
    
    <button id="delete-btn">Jugar</button>
    <div id="fullscreen-container"></div>
    
    <div id="champion-history">
        <h2>Campeones del Mundo</h2>
        <ul id="champion-list"></ul>
    </div>

    <script>
document.addEventListener('DOMContentLoaded', () => {
    const leftGroups = document.getElementById('left-groups');
    const rightGroups = document.getElementById('right-groups');
    const deleteBtn = document.getElementById('delete-btn');
    const fullscreenContainer = document.getElementById('fullscreen-container');
    const championList = document.getElementById('champion-list');
    const phaseTitle = document.getElementById('phase-title');
    const tournamentNumberElement = document.getElementById('tournament-number');

    const images = [
        { src: "img1.jpg", alt: "Part. 1" }, { src: "img2.jpg", alt: "Part. 2" },
        { src: "img3.jpg", alt: "Part. 3" }, { src: "img4.jpg", alt: "Part. 4" },
        { src: "img5.jpg", alt: "Part. 5" }, { src: "img6.jpg", alt: "Part. 6" },
        { src: "img7.jpg", alt: "Part. 7" }, { src: "img8.png", alt: "Part. 8" },
        { src: "img9.jpg", alt: "Part. 9" }, { src: "img10.jpg", alt: "Part. 10" },
        { src: "img11.jpg", alt: "Part. 11" }, { src: "img12.jpg", alt: "Part. 12" },
        { src: "img13.jpg", alt: "Part. 13" }, { src: "img14.jpg", alt: "Part. 14" },
        { src: "img15.jpg", alt: "Part. 15" }, { src: "img16.jpg", alt: "Part. 16" },
        { src: "img17.jpg", alt: "Part. 17" }, { src: "img18.jpg", alt: "Part. 18" },
        { src: "img19.png", alt: "Part. 19" }, { src: "img20.png", alt: "Part. 20" },
        { src: "img21.jpg", alt: "Part. 21" }, { src: "img22.jpg", alt: "Part. 22" },
        { src: "img23.jpg", alt: "Part. 23" }, { src: "img24.jpg", alt: "Part. 24" },
        { src: "img25.jpg", alt: "Part. 25" }, { src: "img26.jpg", alt: "Part. 26" },
        { src: "img27.jpg", alt: "Part. 27" }, { src: "img28.jpg", alt: "Part. 28" },
        { src: "img29.jpg", alt: "Part. 29" }, { src: "img30.jpg", alt: "Part. 30" },
        { src: "img31.jpg", alt: "Part. 31" }, { src: "img32.jpg", alt: "Part. 32" }
    ];

    let currentPhase = 'groups';
    let groups = []; 
    let currentPhaseParticipants = []; 
    let losersSemifinal = []; 
    let finalParticipants = []; 
    let thirdPlaceWinner = null;
    let tournamentNumber = 1;
    let championsData = {}; 
    let h2hMatches = {}; 

    const groupNames = ['Grupo A', 'Grupo B', 'Grupo C', 'Grupo D', 'Grupo E', 'Grupo F', 'Grupo G', 'Grupo H'];

    const saveToLocalStorage = () => {
        localStorage.setItem('tournamentNumber', tournamentNumber.toString());
        localStorage.setItem('champions', JSON.stringify(championsData));
        localStorage.setItem('currentPhase', currentPhase);
        localStorage.setItem('currentPhaseParticipants', JSON.stringify(currentPhaseParticipants));
        localStorage.setItem('losersSemifinal', JSON.stringify(losersSemifinal));
        localStorage.setItem('finalParticipants', JSON.stringify(finalParticipants));
        localStorage.setItem('thirdPlaceWinner', JSON.stringify(thirdPlaceWinner));
        localStorage.setItem('groups', JSON.stringify(groups));
        localStorage.setItem('h2hMatches', JSON.stringify(h2hMatches));
    };

    const loadFromLocalStorage = () => {
        if (localStorage.getItem('tournamentNumber')) tournamentNumber = parseInt(localStorage.getItem('tournamentNumber'));
        if (localStorage.getItem('champions')) championsData = JSON.parse(localStorage.getItem('champions'));
        if (localStorage.getItem('currentPhase')) currentPhase = localStorage.getItem('currentPhase');
        if (localStorage.getItem('currentPhaseParticipants')) currentPhaseParticipants = JSON.parse(localStorage.getItem('currentPhaseParticipants'));
        if (localStorage.getItem('losersSemifinal')) losersSemifinal = JSON.parse(localStorage.getItem('losersSemifinal'));
        if (localStorage.getItem('finalParticipants')) finalParticipants = JSON.parse(localStorage.getItem('finalParticipants'));
        if (localStorage.getItem('thirdPlaceWinner')) thirdPlaceWinner = JSON.parse(localStorage.getItem('thirdPlaceWinner'));
        if (localStorage.getItem('groups')) groups = JSON.parse(localStorage.getItem('groups'));
        if (localStorage.getItem('h2hMatches')) h2hMatches = JSON.parse(localStorage.getItem('h2hMatches'));

        updateTournamentNumber();
        renderChampionHistory();
    };

    const shuffleArray = (array) => {
        for (let i = array.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [array[i], array[j]] = [array[j], array[i]];
        }
        return array;
    };

    const recordMatchH2H = (teamA, teamB, golesA, golesB, phaseName) => {
        const key = [teamA.alt, teamB.alt].sort().join(" vs ");
        if (!h2hMatches[key]) h2hMatches[key] = [];
        h2hMatches[key].push({
            tNum: tournamentNumber, phase: phaseName,
            teamA: teamA.alt, teamB: teamB.alt, gA: golesA, gB: golesB
        });
    };

    const showTeamProfile = (teamAlt, teamSrc) => {
        fullscreenContainer.innerHTML = '';
        const img = document.createElement('img');
        img.src = teamSrc;
        fullscreenContainer.appendChild(img);

        const card = document.createElement('div');
        card.className = 'profile-card';
        card.innerHTML = `<h3>Historial de ${teamAlt}</h3>`;

        const scrollContainer = document.createElement('div');
        scrollContainer.className = 'stats-scroll';

        let matchCount = 0;
        let summary = {};

        Object.keys(h2hMatches).forEach(key => {
            if (key.includes(teamAlt)) {
                h2hMatches[key].forEach(m => {
                    matchCount++;
                    const opponent = m.teamA === teamAlt ? m.teamB : m.teamA;
                    const misGoles = m.teamA === teamAlt ? m.gA : m.gB;
                    const susGoles = m.teamA === teamAlt ? m.gB : m.gA;
                    
                    let resultado = "Empate";
                    if (misGoles > susGoles) resultado = "Ganó";
                    if (misGoles < susGoles) resultado = "Perdió";

                    if (!summary[opponent]) {
                        summary[opponent] = { jugados: 0, ganados: 0, perdidos: 0, empatados: 0 };
                    }
                    summary[opponent].jugados++;
                    if (resultado === "Ganó") summary[opponent].ganados++;
                    if (resultado === "Perdió") summary[opponent].perdidos++;
                    if (resultado === "Empate") summary[opponent].empatados++;

                    const row = document.createElement('div');
                    row.className = 'stats-row';
                    row.innerHTML = `
                        <span><b>T${m.tNum.toString().padStart(3,'0')}</b> - ${m.phase}</span>
                        <span>vs ${opponent} <b>(${misGoles}-${susGoles})</b> [${resultado}]</span>
                    `;
                    scrollContainer.appendChild(row);
                });
            }
        });

        if (matchCount === 0) {
            scrollContainer.innerHTML = `<div style="text-align:center;color:#aaa;padding:10px;">Sin enfrentamientos grabados.</div>`;
        } else {
            let totalGanados = Object.values(summary).reduce((a, b) => a + b.ganados, 0);
            const summaryHeader = document.createElement('div');
            summaryHeader.style.cssText = "margin-bottom:10px; padding-bottom:5px; border-bottom:1px solid #ffd700; font-size:11px; color:#4ad66d;";
            summaryHeader.innerHTML = `Total partidos: ${matchCount} | Victorias: ${totalGanados}`;
            card.insertBefore(summaryHeader, card.firstChild);
        }

        card.appendChild(scrollContainer);
        fullscreenContainer.appendChild(card);
        fullscreenContainer.style.display = 'flex';
    };

    const loadGroups = () => {
        groups = []; losersSemifinal = []; finalParticipants = []; thirdPlaceWinner = null;
        const shuffledImages = shuffleArray([...images]);
        
        for (let i = 0; i < 8; i++) {
            const groupTeams = shuffledImages.slice(i * 4, (i + 1) * 4).map(img => ({
                src: img.src, alt: img.alt, pts: 0, dg: 0, gf: 0, gc: 0
            }));
            groups.push({
                name: groupNames[i], teams: groupTeams, round: 0,
                fixtures: [[[0, 1], [2, 3]], [[0, 2], [1, 3]], [[0, 3], [1, 2]]],
                ticker: []
            });
        }
        currentPhase = 'groups';
        saveToLocalStorage();
        renderGroupsFromState(); 
        updateTournamentNumber();
    };

    const renderGroupsFromState = () => {
        currentPhase = 'groups';
        phaseTitle.textContent = 'Fase de Grupos';
        leftGroups.innerHTML = ''; rightGroups.innerHTML = '';
        deleteBtn.textContent = "Jugar";
        deleteBtn.style.backgroundColor = "#e63946";
        
        groups.forEach((group, i) => {
            const groupDiv = document.createElement('div');
            groupDiv.className = 'group';
            
            const sortedTeams = [...group.teams].sort((a, b) => {
                if (b.pts !== a.pts) return b.pts - a.pts;
                if (b.dg !== a.dg) return b.dg - a.dg;
                return b.gf - a.gf;
            });

            let roundText = group.round >= 3 ? "Finalizado" : `Jornada ${group.round}/3`;
            groupDiv.innerHTML = `<h2>${group.name} (${roundText})</h2>`;
            
            const table = document.createElement('table');
            table.className = 'group-table';
            table.innerHTML = `<thead><tr><th style="text-align:left;">Equipo</th><th>PTS</th><th>DG</th><th>GF</th></tr></thead><tbody></tbody>`;
            
            const tbody = table.querySelector('tbody');
            sortedTeams.forEach((team, idx) => {
                const tr = document.createElement('tr');
                if (group.round >= 3 && idx < 2) tr.className = 'classified';

                tr.innerHTML = `
                    <td class="team-name">
                        <img src="${team.src}" alt="${team.alt}" class="view-img">
                        <span>${team.alt}</span>
                    </td>
                    <td><b>${team.pts}</b></td>
                    <td>${team.dg > 0 ? '+'+team.dg : team.dg}</td>
                    <td>${team.gf}</td>
                `;

                tr.querySelector('.view-img').addEventListener('click', () => {
                    showTeamProfile(team.alt, team.src);
                });
                tbody.appendChild(tr);
            });

            groupDiv.appendChild(table);

            if (group.ticker.length > 0) {
                const tickerDiv = document.createElement('div');
                tickerDiv.className = 'ticker-container';
                tickerDiv.innerHTML = group.ticker.map(t => `<div>${t}</div>`).join('');
                groupDiv.appendChild(tickerDiv);
            }
            
            if (i % 2 === 0) leftGroups.appendChild(groupDiv);
            else rightGroups.appendChild(groupDiv);
        });
    };

    const loadEliminatories = (phase, participants) => {
        currentPhase = phase;
        currentPhaseParticipants = participants;
        saveToLocalStorage();

        phaseTitle.textContent = {
            'octavos': 'Octavos de Final', 'cuartos': 'Cuartos de Final',
            'semifinales': 'Semifinales', 'tercer-puesto': 'Tercer y Cuarto Puesto', 'final': 'Gran Final'
        }[phase];
        
        if(phase === 'tercer-puesto') {
            deleteBtn.textContent = "Jugar 3er Puesto";
            deleteBtn.style.backgroundColor = "#f4a261";
        } else if(phase === 'final') {
            deleteBtn.textContent = "Jugar Gran Final";
            deleteBtn.style.backgroundColor = "#ffd700";
            deleteBtn.style.color = "#000";
        } else {
            deleteBtn.textContent = "Jugar";
            deleteBtn.style.backgroundColor = "#e63946";
            deleteBtn.style.color = "#fff";
        }

        leftGroups.innerHTML = ''; rightGroups.innerHTML = '';
        
        for (let i = 0; i < participants.length; i += 2) {
            const matchParticipants = [participants[i], participants[i + 1]].filter(Boolean);
            const matchDiv = document.createElement('div');
            matchDiv.className = 'match';
            matchDiv.innerHTML = `<h2>Partido ${i / 2 + 1}</h2>`;
            const galleryDiv = document.createElement('div');
            galleryDiv.className = 'match-gallery';
            
            matchParticipants.forEach(image => {
                const teamWrapper = document.createElement('div');
                teamWrapper.className = 'match-team';
                teamWrapper.innerHTML = `<img src="${image.src}" alt="${image.alt}"><span>${image.alt}</span>`;
                
                teamWrapper.querySelector('img').addEventListener('click', (e) => {
                    e.stopPropagation();
                    showTeamProfile(image.alt, image.src);
                });
                galleryDiv.appendChild(teamWrapper);
            });
            
            matchDiv.appendChild(galleryDiv);
            if ((i / 2) % 2 === 0) leftGroups.appendChild(matchDiv);
            else rightGroups.appendChild(matchDiv);
        }
        updateTournamentNumber();
    };

    const updateTournamentNumber = () => {
        tournamentNumberElement.textContent = tournamentNumber.toString().padStart(3, '0');
    };

    const updateChampionHistory = (winner) => {
        const winnerKey = `${winner.src}:${winner.alt}`;
        if (!championsData[winnerKey]) {
            championsData[winnerKey] = { src: winner.src, alt: winner.alt, count: 1, championedTournaments: [tournamentNumber] };
        } else {
            championsData[winnerKey].count += 1;
            if (!championsData[winnerKey].championedTournaments.includes(tournamentNumber)) {
                championsData[winnerKey].championedTournaments.push(tournamentNumber);
            }
            championsData[winnerKey].championedTournaments.sort((a, b) => a - b);
        }
        tournamentNumber++;
        saveToLocalStorage(); 
        renderChampionHistory();
    };

    const renderChampionHistory = () => {
        championList.innerHTML = '';
        Object.values(championsData)
            .sort((a, b) => b.count - a.count)
            .forEach((champion, index) => {
                const tournamentList = (champion.championedTournaments || []).map(tNum => `T${tNum.toString().padStart(3, '0')}`).join(', ');
                const li = document.createElement('li');
                li.innerHTML = `
                    <img src="${champion.src}" alt="${champion.alt}" class="trophy">
                    <span>${champion.alt} (${champion.count} veces)</span>
                    <span class="trophy-history">${tournamentList}</span>`;
                
                if (index === 0) li.classList.add('gold');
                else if (index === 1) li.classList.add('silver');
                else if (index === 2) li.classList.add('bronze');
                
                championList.appendChild(li);
                li.querySelector('.trophy').addEventListener('click', () => {
                    showTeamProfile(champion.alt, champion.src);
                });
            });
    };

    deleteBtn.addEventListener('click', () => {
        if (currentPhase === 'groups') {
            if (groups[0].round >= 3) {
                let octavosParticipants = [];
                groups.forEach(group => {
                    const sorted = [...group.teams].sort((a, b) => {
                        if (b.pts !== a.pts) return b.pts - a.pts;
                        if (b.dg !== a.dg) return b.dg - a.dg;
                        return b.gf - a.gf;
                    });
                    octavosParticipants.push(sorted[0], sorted[1]); 
                });
                loadEliminatories('octavos', shuffleArray(octavosParticipants));
                return;
            }

            groups.forEach(group => {
                const currentRoundMatches = group.fixtures[group.round];
                group.ticker = [`<b>Jornada ${group.round + 1}:</b>`]; 

                currentRoundMatches.forEach(match => {
                    const teamA = group.teams[match[0]];
                    const teamB = group.teams[match[1]];

                    const golesA = Math.floor(Math.random() * 4);
                    const golesB = Math.floor(Math.random() * 4);

                    teamA.gf += golesA; teamA.gc += golesB; teamA.dg = teamA.gf - teamA.gc;
                    teamB.gf += golesB; teamB.gc += golesA; teamB.dg = teamB.gf - teamB.gc;

                    if (golesA > golesB) teamA.pts += 3;
                    else if (golesB > golesA) teamB.pts += 3;
                    else { teamA.pts += 1; teamB.pts += 1; }

                    recordMatchH2H(teamA, teamB, golesA, golesB, `Grupo`);
                    group.ticker.push(`${teamA.alt} ${golesA} - ${golesB} ${teamB.alt}`);
                });
                group.round++;
            });

            saveToLocalStorage();
            renderGroupsFromState();

            if (groups[0].round >= 3) {
                deleteBtn.textContent = "Ir a Octavos";
                deleteBtn.style.backgroundColor = "#4ad66d";
            }

        } else {
            let allMatchesElements = document.querySelectorAll('.match-gallery');
            let winners = [];
            let currentLosers = [];

            allMatchesElements.forEach((matchElement) => {
                const teams = matchElement.querySelectorAll('.match-team');
                if (teams.length === 2) {
                    const teamAElement = teams[0];
                    const teamBElement = teams[1];
                    const imgA = teamAElement.querySelector('img');
                    const imgB = teamBElement.querySelector('img');

                    const altA = imgA.alt; const srcA = imgA.src;
                    const altB = imgB.alt; const srcB = imgB.src;

                    let gA = Math.floor(Math.random() * 4);
                    let gB = Math.floor(Math.random() * 4);
                    if (gA === gB) { 
                        if (Math.random() > 0.5) gA++; else gB++;
                    }

                    recordMatchH2H({alt: altA}, {alt: altB}, gA, gB, phaseTitle.textContent);

                    if (gA > gB) {
                        teamBElement.classList.add('eliminated');
                        winners.push({ src: srcA, alt: altA });
                        currentLosers.push({ src: srcB, alt: altB });
                    } else {
                        teamAElement.classList.add('eliminated');
                        winners.push({ src: srcB, alt: altB });
                        currentLosers.push({ src: srcA, alt: altA });
                    }
                }
            });

            setTimeout(() => {
                if (currentPhase === 'octavos') {
                    loadEliminatories('cuartos', shuffleArray(winners));
                } else if (currentPhase === 'cuartos') {
                    loadEliminatories('semifinales', shuffleArray(winners));
                } else if (currentPhase === 'semifinales') {
                    losersSemifinal = currentLosers; 
                    finalParticipants = winners; 
                    loadEliminatories('tercer-puesto', losersSemifinal);
                } else if (currentPhase === 'tercer-puesto') {
                    thirdPlaceWinner = winners[0]; 
                    loadEliminatories('final', finalParticipants);
                } else if (currentPhase === 'final') {
                    const winner = winners[0];
                    fullscreenContainer.innerHTML = `
                        <img src="${winner.src}" alt="${winner.alt}">
                        <h2>¡${winner.alt} es el CAMPEÓN!</h2>
                        <p style="color:#ffd700; margin-top:10px; font-size: 16px;">🥉 3er Puesto: ${thirdPlaceWinner ? thirdPlaceWinner.alt : 'N/A'}</p>
                        <button id="restart-btn">Nuevo Campeonato</button>
                    `;
                    fullscreenContainer.style.display = 'flex';
                    updateChampionHistory(winner); 
                    
                    document.getElementById('restart-btn').addEventListener('click', () => {
                        fullscreenContainer.style.display = 'none';
                        loadGroups(); 
                    });
                }
            }, 600);
        }
    });

    fullscreenContainer.addEventListener('click', (e) => {
        if (e.target.tagName !== 'BUTTON' && e.target.id !== 'restart-btn' && e.target.tagName !== 'IMG' && !e.target.closest('.profile-card')) {
            fullscreenContainer.style.display = 'none';
        }
    });

    loadFromLocalStorage();
    if (currentPhase === 'groups') {
        if (groups.length === 0) loadGroups();
        else {
            renderGroupsFromState();
            if (groups[0].round >= 3) {
                deleteBtn.textContent = "Ir a Octavos";
                deleteBtn.style.backgroundColor = "#4ad66d";
            }
        }
    } else {
        loadEliminatories(currentPhase, currentPhaseParticipants);
    }
});
    </script>
</body>
</html>
