<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Campeonato Mundial</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: #121212;
            color: #fff;
            text-align: center;
            padding: 15px;
            min-height: 100vh;
        }

        h1 {
            margin-bottom: 15px;
            font-size: clamp(1.5em, 5vw, 2.5em);
            color: #ffd700;
        }

        #phase-title {
            margin-bottom: 15px;
            font-size: clamp(1.2em, 4vw, 1.8em);
            color: #ffd700;
        }

        .group-container {
            display: flex;
            justify-content: space-between;
            max-width: 1200px;
            margin: 0 auto 20px;
            gap: 15px;
        }

        #left-groups, #right-groups {
            display: flex;
            flex-direction: column;
            width: 49%;
            gap: 15px;
        }

        .group, .match {
            background: rgba(255, 255, 255, 0.05);
            padding: 12px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .group h2, .match h2 {
            color: #ffd700;
            margin-bottom: 10px;
            font-size: clamp(1em, 3vw, 1.2em);
        }

        /* Tabla de posiciones de grupos */
        .group-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 8px;
            font-size: clamp(11px, 2.2vw, 13px);
        }

        .group-table th, .group-table td {
            padding: 6px 4px;
            text-align: center;
        }

        .group-table th {
            color: #f4a261;
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
        }

        .group-table td.team-name {
            text-align: left;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .group-table img {
            width: 20px;
            height: 20px;
            object-fit: cover;
            border-radius: 3px;
        }

        .classified {
            color: #4ad66d;
            font-weight: bold;
        }

        /* Estilos de eliminatorias directas */
        .match-gallery {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 6px;
        }

        .match-gallery img {
            width: 50px;
            height: 50px;
            object-fit: cover;
            border-radius: 6px;
            cursor: pointer;
            transition: transform 0.3s, box-shadow 0.3s, opacity 0.5s, width 0.5s, padding 0.5s;
        }
        
        .match-gallery img.eliminated {
            opacity: 0;
            width: 0px;
            padding: 0;
            pointer-events: none;
        }

        #delete-btn {
            position: fixed;
            bottom: 15px;
            right: 15px;
            background-color: #e63946;
            color: white;
            border: none;
            padding: clamp(10px, 2vw, 15px);
            font-size: clamp(14px, 3vw, 18px);
            border-radius: 50%;
            cursor: pointer;
            transition: background 0.3s, transform 0.2s;
            z-index: 1000;
        }

        #delete-btn:hover {
            background-color: #ff4d5a;
            transform: scale(1.1);
        }

        #fullscreen-container {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            align-items: center;
            justify-content: center;
            flex-direction: column;
            z-index: 2000;
            padding: 20px;
        }

        #fullscreen-container img {
            max-width: 90%;
            max-height: 60%;
            border-radius: 8px;
        }

        #fullscreen-container h2 {
            margin-top: 15px;
            color: #ffd700;
        }

        /* Contenedor de resultados de la jornada */
        .ticker-container {
            background: rgba(0, 0, 0, 0.4);
            padding: 8px;
            border-radius: 6px;
            margin-top: 10px;
            font-size: 11px;
            color: #ccc;
            text-align: left;
            max-height: 80px;
            overflow-y: auto;
        }

        #restart-btn {
            margin-top: 15px;
            padding: 8px 15px;
            background: #f4a261;
            border: none;
            color: white;
            font-size: clamp(12px, 2.5vw, 16px);
            border-radius: 4px;
            cursor: pointer;
        }

        /* --- CORRECCIÓN HISTORIAL CAMPEONES --- */
        #champion-history {
            margin-top: 30px;
        }

        #champion-list {
            list-style: none;
            padding: 0;
            max-width: 600px;
            margin: 0 auto;
            max-height: 380px;    /* Límite de altura para móviles y escritorio */
            overflow-y: auto;     /* Activa scroll interno */
            padding-right: 5px;
        }

        #champion-list li {
            background: rgba(255, 255, 255, 0.1);
            margin: 8px 0;
            padding: 10px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            font-size: clamp(12px, 2.5vw, 14px);
        }

        #champion-list li.gold { background: rgba(255, 215, 0, 0.2); border: 2px solid #ffd700; }
        #champion-list li.silver { background: rgba(192, 192, 192, 0.2); border: 2px solid #c0c0c0; }
        #champion-list li.bronze { background: rgba(205, 127, 50, 0.2); border: 2px solid #cd7f32; }

        #champion-list img.trophy {
            width: 35px;
            height: 35px;
            border-radius: 50%;
            cursor: pointer;
            object-fit: cover;
        }
        
        #champion-list .trophy-history {
            font-weight: bold;
            color: #f4a261;
            font-size: 11px;
            max-width: 55%;
            text-align: right;
            word-break: break-word; /* Salto de línea limpio para listas de más de 30 títulos */
        }

        /* --- RESPONSIVE / MEDIA QUERIES --- */
        @media (max-width: 768px) {
            .group-container {
                flex-direction: column; /* Apila los grupos hacia abajo de manera limpia */
                gap: 15px;
            }
            #left-groups, #right-groups {
                width: 100%;
                display: flex;
                flex-direction: column;
                gap: 15px;
            }
            .group, .match {
                padding: 12px;
            }
        }
    </style>
</head>
<body>
    <h1>Campeonato Mundial <span id="tournament-number">001</span></h1>
    <h2 id="phase-title">Fase de Grupos</h2>
    
    <div class="group-container">
        <div id="left-groups"></div>
        <div id="right-groups"></div>
    </div>
    
    <button id="delete-btn">Jugar</button>
    <div id="fullscreen-container"></div>
    
    <div id="champion-history">
        <h2>Campeones del Mundo</h2>
        <ul id="champion-list"></ul>
    </div>

    <script>
document.addEventListener('DOMContentLoaded', () => {
    const leftGroups = document.getElementById('left-groups');
    const rightGroups = document.getElementById('right-groups');
    const deleteBtn = document.getElementById('delete-btn');
    const fullscreenContainer = document.getElementById('fullscreen-container');
    const championList = document.getElementById('champion-list');
    const phaseTitle = document.getElementById('phase-title');
    const tournamentNumberElement = document.getElementById('tournament-number');

    const images = [
        { src: "img1.jpg", alt: "Part. 1" }, { src: "img2.jpg", alt: "Part. 2" },
        { src: "img3.jpg", alt: "Part. 3" }, { src: "img4.jpg", alt: "Part. 4" },
        { src: "img5.jpg", alt: "Part. 5" }, { src: "img6.jpg", alt: "Part. 6" },
        { src: "img7.jpg", alt: "Part. 7" }, { src: "img8.png", alt: "Part. 8" },
        { src: "img9.jpg", alt: "Part. 9" }, { src: "img10.jpg", alt: "Part. 10" },
        { src: "img11.jpg", alt: "Part. 11" }, { src: "img12.jpg", alt: "Part. 12" },
        { src: "img13.jpg", alt: "Part. 13" }, { src: "img14.jpg", alt: "Part. 14" },
        { src: "img15.jpg", alt: "Part. 15" }, { src: "img16.jpg", alt: "Part. 16" },
        { src: "img17.jpg", alt: "Part. 17" }, { src: "img18.jpg", alt: "Part. 18" },
        { src: "img19.png", alt: "Part. 19" }, { src: "img20.png", alt: "Part. 20" },
        { src: "img21.jpg", alt: "Part. 21" }, { src: "img22.jpg", alt: "Part. 22" },
        { src: "img23.jpg", alt: "Part. 23" }, { src: "img24.jpg", alt: "Part. 24" },
        { src: "img25.jpg", alt: "Part. 25" }, { src: "img26.jpg", alt: "Part. 26" },
        { src: "img27.jpg", alt: "Part. 27" }, { src: "img28.jpg", alt: "Part. 28" },
        { src: "img29.jpg", alt: "Part. 29" }, { src: "img30.jpg", alt: "Part. 30" },
        { src: "img31.jpg", alt: "Part. 31" }, { src: "img32.jpg", alt: "Part. 32" }
    ];

    let currentPhase = 'groups';
    let groups = []; 
    let currentPhaseParticipants = []; 
    let tournamentNumber = 1;
    let championsData = {}; 
    const groupNames = ['Grupo A', 'Grupo B', 'Grupo C', 'Grupo D', 'Grupo E', 'Grupo F', 'Grupo G', 'Grupo H'];

    const saveToLocalStorage = () => {
        localStorage.setItem('tournamentNumber', tournamentNumber.toString());
        localStorage.setItem('champions', JSON.stringify(championsData));
        localStorage.setItem('currentPhase', currentPhase);
        localStorage.setItem('currentPhaseParticipants', JSON.stringify(currentPhaseParticipants));
        localStorage.setItem('groups', JSON.stringify(groups));
    };

    const loadFromLocalStorage = () => {
        const savedTournament = localStorage.getItem('tournamentNumber');
        if (savedTournament) tournamentNumber = parseInt(savedTournament);
        const savedChampions = localStorage.getItem('champions');
        if (savedChampions) championsData = JSON.parse(savedChampions);
        const savedPhase = localStorage.getItem('currentPhase');
        const savedParticipants = localStorage.getItem('currentPhaseParticipants');
        const savedGroups = localStorage.getItem('groups');

        if (savedPhase) currentPhase = savedPhase;
        if (savedParticipants) currentPhaseParticipants = JSON.parse(savedParticipants);
        if (savedGroups) groups = JSON.parse(savedGroups);

        updateTournamentNumber();
        renderChampionHistory();
    };

    const shuffleArray = (array) => {
        for (let i = array.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [array[i], array[j]] = [array[j], array[i]];
        }
        return array;
    };

    const generateFixtures = () => {
        return [
            [[0, 1], [2, 3]], 
            [[0, 2], [1, 3]], 
            [[0, 3], [1, 2]]  
        ];
    };

    const loadGroups = () => {
        groups = []; 
        const shuffledImages = shuffleArray([...images]);
        
        for (let i = 0; i < 8; i++) {
            const groupTeams = shuffledImages.slice(i * 4, (i + 1) * 4).map(img => ({
                src: img.src,
                alt: img.alt,
                pts: 0, dg: 0, gf: 0, gc: 0
            }));

            groups.push({
                name: groupNames[i],
                teams: groupTeams,
                round: 0, 
                fixtures: generateFixtures(),
                ticker: [] 
            });
        }
        currentPhase = 'groups';
        saveToLocalStorage();
        renderGroupsFromState(); 
        updateTournamentNumber();
    };

    const renderGroupsFromState = () => {
        currentPhase = 'groups';
        phaseTitle.textContent = 'Fase de Grupos';
        leftGroups.innerHTML = '';
        rightGroups.innerHTML = '';
        
        groups.forEach((group, i) => {
            const groupDiv = document.createElement('div');
            groupDiv.className = 'group';
            
            const sortedTeams = [...group.teams].sort((a, b) => {
                if (b.pts !== a.pts) return b.pts - a.pts;
                if (b.dg !== a.dg) return b.dg - a.dg;
                return b.gf - a.gf;
            });

            let roundText = group.round >= 3 ? "Finalizado" : `Jornada ${group.round}/3`;
            groupDiv.innerHTML = `<h2>${group.name} (${roundText})</h2>`;
            
            const table = document.createElement('table');
            table.className = 'group-table';
            table.innerHTML = `
                <thead>
                    <tr>
                        <th style="text-align:left;">Equipo</th>
                        <th>PTS</th>
                        <th>DG</th>
                        <th>GF</th>
                    </tr>
                </thead>
                <tbody></tbody>
            `;
            
            const tbody = table.querySelector('tbody');
            sortedTeams.forEach((team, idx) => {
                const tr = document.createElement('tr');
                if (group.round >= 3 && idx < 2) tr.className = 'classified';

                tr.innerHTML = `
                    <td class="team-name">
                        <img src="${team.src}" alt="${team.alt}" class="view-img">
                        <span>${team.alt}</span>
                    </td>
                    <td><b>${team.pts}</b></td>
                    <td>${team.dg > 0 ? '+'+team.dg : team.dg}</td>
                    <td>${team.gf}</td>
                `;

                tr.querySelector('.view-img').addEventListener('click', () => {
                    fullscreenContainer.innerHTML = `<img src="${team.src}" alt="${team.alt}">`;
                    fullscreenContainer.style.display = 'flex';
                });

                tbody.appendChild(tr);
            });

            groupDiv.appendChild(table);

            if (group.ticker.length > 0) {
                const tickerDiv = document.createElement('div');
                tickerDiv.className = 'ticker-container';
                tickerDiv.innerHTML = group.ticker.map(t => `<div>${t}</div>`).join('');
                groupDiv.appendChild(tickerDiv);
            }
            
            if (i % 2 === 0) leftGroups.appendChild(groupDiv);
            else rightGroups.appendChild(groupDiv);
        });
    };

    const loadEliminatories = (phase, participants) => {
        currentPhase = phase;
        currentPhaseParticipants = participants;
        saveToLocalStorage();

        phaseTitle.textContent = {
            'octavos': 'Octavos de Final', 'cuartos': 'Cuartos de Final',
            'semifinales': 'Semifinales', 'final': 'Final'
        }[phase];
        
        leftGroups.innerHTML = ''; rightGroups.innerHTML = '';
        
        for (let i = 0; i < participants.length; i += 2) {
            const matchParticipants = [participants[i], participants[i + 1]].filter(Boolean);
            const matchDiv = document.createElement('div');
            matchDiv.className = 'match';
            matchDiv.innerHTML = `<h2>Partido ${i / 2 + 1}</h2>`;
            const galleryDiv = document.createElement('div');
            galleryDiv.className = 'match-gallery';
            
            matchParticipants.forEach(image => {
                const imgElement = document.createElement('img');
                imgElement.src = image.src;
                imgElement.alt = image.alt;
                imgElement.setAttribute('data-src', image.src);
                imgElement.addEventListener('click', () => {
                    fullscreenContainer.innerHTML = `<img src="${image.src}" alt="${image.alt}">`;
                    fullscreenContainer.style.display = 'flex';
                });
                galleryDiv.appendChild(imgElement);
            });
            
            matchDiv.appendChild(galleryDiv);
            if ((i / 2) % 2 === 0) leftGroups.appendChild(matchDiv);
            else rightGroups.appendChild(matchDiv);
        }
        updateTournamentNumber();
    };

    const updateTournamentNumber = () => {
        tournamentNumberElement.textContent = tournamentNumber.toString().padStart(3, '0');
    };

    const updateChampionHistory = (winner) => {
        const winnerKey = `${winner.src}:${winner.alt}`;
        if (!championsData[winnerKey]) {
            championsData[winnerKey] = { src: winner.src, alt: winner.alt, count: 1, championedTournaments: [tournamentNumber] };
        } else {
            championsData[winnerKey].count += 1;
            if (!championsData[winnerKey].championedTournaments.includes(tournamentNumber)) {
                championsData[winnerKey].championedTournaments.push(tournamentNumber);
            }
            championsData[winnerKey].championedTournaments.sort((a, b) => a - b);
        }
        tournamentNumber++;
        saveToLocalStorage(); 
        renderChampionHistory();
    };

    const renderChampionHistory = () => {
        championList.innerHTML = '';
        Object.values(championsData)
            .sort((a, b) => b.count - a.count)
            .forEach((champion, index) => {
                const tournamentList = (champion.championedTournaments || []).map(tNum => `T${tNum.toString().padStart(3, '0')}`).join(', ');
                const li = document.createElement('li');
                li.innerHTML = `
                    <img src="${champion.src}" alt="${champion.alt}" class="trophy">
                    <span>${champion.alt} (${champion.count} veces)</span>
                    <span class="trophy-history">${tournamentList}</span>`;
                
                if (index === 0) li.classList.add('gold');
                else if (index === 1) li.classList.add('silver');
                else if (index === 2) li.classList.add('bronze');
                
                championList.appendChild(li);
                li.querySelector('.trophy').addEventListener('click', () => {
                    fullscreenContainer.innerHTML = `<img src="${champion.src}" alt="${champion.alt}">`;
                    fullscreenContainer.style.display = 'flex';
                });
            });
    };

    // --- LÓGICA PRINCIPAL (Jugar) ---
    deleteBtn.addEventListener('click', () => {
        if (currentPhase === 'groups') {
            if (groups[0].round >= 3) {
                let octavosParticipants = [];
                groups.forEach(group => {
                    const sorted = [...group.teams].sort((a, b) => {
                        if (b.pts !== a.pts) return b.pts - a.pts;
                        if (b.dg !== a.dg) return b.dg - a.dg;
                        return b.gf - a.gf;
                    });
                    octavosParticipants.push(sorted[0], sorted[1]); 
                });
                
                loadEliminatories('octavos', shuffleArray(octavosParticipants));
                return;
            }

            groups.forEach(group => {
                const currentRoundMatches = group.fixtures[group.round];
                group.ticker = [`<b>Jornada ${group.round + 1}:</b>`]; 

                currentRoundMatches.forEach(match => {
                    const teamA = group.teams[match[0]];
                    const teamB = group.teams[match[1]];

                    const golesA = Math.floor(Math.random() * 4);
                    const golesB = Math.floor(Math.random() * 4);

                    teamA.gf += golesA; teamA.gc += golesB; teamA.dg = teamA.gf - teamA.gc;
                    teamB.gf += golesB; teamB.gc += golesA; teamB.dg = teamB.gf - teamB.gc;

                    if (golesA > golesB) {
                        teamA.pts += 3;
                    } else if (golesB > golesA) {
                        teamB.pts += 3;
                    } else {
                        teamA.pts += 1;
                        teamB.pts += 1;
                    }

                    group.ticker.push(`${teamA.alt} ${golesA} - ${golesB} ${teamB.alt}`);
                });

                group.round++;
            });

            saveToLocalStorage();
            renderGroupsFromState();

            if (groups[0].round >= 3) {
                deleteBtn.textContent = "Ir a Octavos";
                deleteBtn.style.backgroundColor = "#4ad66d";
            }

        } else {
            deleteBtn.textContent = "Jugar";
            deleteBtn.style.backgroundColor = "#e63946";

            let allMatchesElements = document.querySelectorAll('.match-gallery');
            let winners = [];
            
            Array.from(allMatchesElements).forEach((matchElement) => {
                const images = matchElement.querySelectorAll('img:not(.eliminated)');
                if (images.length > 1) {
                    const randomIndex = Math.floor(Math.random() * images.length);
                    const eliminatedImageElement = images[randomIndex];
                    const winnerIndex = 1 - randomIndex; 
                    const winnerImageElement = images[winnerIndex];
                    
                    eliminatedImageElement.classList.add('eliminated');
                    winners.push({ src: winnerImageElement.getAttribute('data-src'), alt: winnerImageElement.alt });
                    setTimeout(() => { eliminatedImageElement.remove(); }, 500);
                } else if (images.length === 1) {
                    winners.push({ src: images[0].getAttribute('data-src'), alt: images[0].alt });
                }
            });

            setTimeout(() => {
                if (currentPhase === 'octavos' && winners.length === 8) {
                    loadEliminatories('cuartos', shuffleArray(winners));
                } else if (currentPhase === 'cuartos' && winners.length === 4) {
                    loadEliminatories('semifinales', shuffleArray(winners));
                } else if (currentPhase === 'semifinales' && winners.length === 2) {
                    loadEliminatories('final', winners);
                } else if (currentPhase === 'final' && winners.length === 1) {
                    const winner = winners[0];
                    fullscreenContainer.innerHTML = `
                        <img src="${winner.src}" alt="${winner.alt}">
                        <h2>¡${winner.alt} es el CAMPEÓN del Torneo ${tournamentNumber.toString().padStart(3, '0')}!</h2>
                        <button id="restart-btn">Nuevo Campeonato</button>`;
                    fullscreenContainer.style.display = 'flex';
                    updateChampionHistory(winner); 
                    
                    document.getElementById('restart-btn').addEventListener('click', () => {
                        fullscreenContainer.style.display = 'none';
                        loadGroups(); 
                    });
                } else {
                    loadEliminatories(currentPhase, winners);
                }
            }, 600);
        }
    });

    fullscreenContainer.addEventListener('click', (e) => {
        if (e.target.tagName !== 'BUTTON' && e.target.id !== 'restart-btn' && e.target.tagName !== 'IMG') {
            fullscreenContainer.style.display = 'none';
        }
    });

    const initializeApp = () => {
        loadFromLocalStorage();
        if (currentPhase === 'groups') {
            if (groups.length === 0) {
                 loadGroups();
            } else {
                renderGroupsFromState();
                if (groups[0].round >= 3) {
                    deleteBtn.textContent = "Ir a Octavos";
                    deleteBtn.style.backgroundColor = "#4ad66d";
                }
            }
        } else {
            loadEliminatories(currentPhase, currentPhaseParticipants);
        }
    };

    initializeApp();
});
    </script>
</body>
</html>
